{% extends "base.html" %}

{% block title %}Login | Fitness Manager{% endblock %}

{% block content %}
  <div class="page-head">
    <div>
      <h1 class="title">Login</h1>
      <p class="subtitle">Welcome back. Keep the streak alive.</p>
    </div>
  </div>
  <div class="panel" style="max-width: 560px">
    <div class="panel-inner">
    <form id="login-form" method="post">
      {% csrf_token %}
      {{ form.as_p }}
    </form>

    <div class="auth-actions auth-actions-stack">
      <button class="btn auth-btn" type="submit" form="login-form">Sign in</button>
      <a class="btn btn-ghost auth-btn" href="{% url 'signup' %}">Create account</a>
      <form class="auth-inline-form" method="post" action="{% url 'guest_login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />
        <button class="btn btn-ghost auth-btn" type="submit">Continue as guest</button>
      </form>
    </div>
    </div>
  </div>
{% endblock %}
