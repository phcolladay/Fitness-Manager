{% extends "base.html" %}

{% block title %}Login | Fitness Manager{% endblock %}

{% block content %}
  <div class="page-head">
    <div>
      <h1 class="title">Login</h1>
      <p class="subtitle">Welcome back. Keep the streak alive.</p>
    </div>
  </div>
  <div class="panel" style="max-width: 560px">
    <div class="panel-inner">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button class="btn" type="submit">Sign in</button>
        <a class="btn btn-ghost" href="{% url 'signup' %}">Create account</a>
      </div>
    </form>
    </div>
  </div>
{% endblock %}
