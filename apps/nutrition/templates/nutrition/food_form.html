{% extends "base.html" %}

{% block title %}Add Food | Fitness Manager{% endblock %}

{% block content %}
  <div class="page-head">
    <div>
      <h1 class="title">Add Food</h1>
      <p class="subtitle">Manual entry, USDA data, or photo recognition.</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-inner">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="source" value="{{ source|default:'manual' }}" />
        <div class="form-actions">
          <button class="btn" type="submit">Save</button>
          <a class="btn btn-ghost" href="{% url 'nutrition:list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
